
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Zainstaluj Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Zbuduj APK
        run: gradle assembleDebug --no-daemon

      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: MojeNaprawy-APK
          path: app/build/outputs/apk/debug/*.apk
